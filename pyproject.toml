[project]
name = "py-multiqr-study"
version = "0.1.0"
description = "OpenCV の detectAndDecodeMulti で複数の QR コードを読み取る勉強用リポジトリです。"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
